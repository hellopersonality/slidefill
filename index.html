<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slidefill</title>
<style>
  :root{
    --o:#ff9f1c; --dot:rgba(255,255,255,.15); --r:#ff3b30; --b:#4aa8ff; --y:#ffd60a; --c:#3d63ff;
    --ink:#0b0b0e; --line:#2a2c34;
    --num:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;color:#fff;font-family:var(--num);overflow:hidden;overscroll-behavior:none;background:#050507;touch-action:none}
  button{font-family:inherit;cursor:pointer}
  #bg{position:fixed;inset:-44px;z-index:0;pointer-events:none;will-change:transform;
    background:radial-gradient(var(--dot) 1.1px,transparent 1.4px) 0 0/22px 22px;animation:drift 3.5s linear infinite}
  @keyframes drift{to{transform:translate(22px,22px)}}
  #app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:520px;margin:0 auto;touch-action:none}
  small{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  header{display:flex;gap:8px;padding:12px 0 4px}
  .tile{height:72px;border-radius:22px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;display:flex;flex-direction:column;justify-content:center}
  .tile b{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .t-level{flex:1.5;background:var(--o);color:#000;flex-direction:row;align-items:center;justify-content:space-between;padding:0 8px;transition:background .5s}
  .t-level .mid{text-align:center;display:flex;flex-direction:column;gap:3px;background:none;border:0;color:inherit;padding:4px 8px}
  .t-moves{flex:1;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 0 0 1px #23252d;padding:0 14px;gap:3px}
  .t-par{width:72px;flex:none;border-radius:50%;background:var(--c);align-items:center;gap:3px}
  .nav{width:30px;height:30px;border-radius:50%;border:0;background:#000;color:var(--o);font-size:17px;line-height:1;padding:0}
  .nav:disabled{opacity:.28}
  #prog{display:flex;gap:5px;padding:6px 2px 2px}
  #prog i{flex:1;height:7px;border-radius:4px;background:#1b1c24}
  #prog i.s1{background:var(--b)} #prog i.s2{background:var(--o)} #prog i.s3{background:var(--y)}
  #prog i.cur{background:#fff;animation:pip 1.4s ease-in-out infinite}
  @keyframes pip{50%{opacity:.35}}
  #stage{flex:1;position:relative;min-height:0;touch-action:none}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .chip{position:absolute;top:4px;width:36px;height:36px;border-radius:50%;border:2px solid #2a2c34;background:#0b0b0e;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
  .chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip:active{transform:scale(.94)}
  #menuBtn{left:2px} #sndBtn{right:2px}
  #status{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 12px;border-radius:999px;
    font:700 10px var(--mono);letter-spacing:.16em;color:#9a9cab;pointer-events:none;transition:background .25s,color .25s}
  #status.bad{background:var(--r);color:#000;animation:throb .7s ease-in-out infinite alternate}
  #status.ok{background:var(--y);color:#000}
  #status.info{background:#1d1f27;color:#fff}
  @keyframes throb{to{transform:translateX(-50%) scale(1.06)}}
  footer{display:flex;gap:8px;padding:6px 0 14px}
  footer button{flex:1;height:56px;border-radius:20px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;
    font:800 14px var(--num);letter-spacing:.08em;color:#000;position:relative}
  #undo{background:var(--b)} #hintBtn{background:var(--y)} #restart{background:var(--r)}
  #undo.off{opacity:.3} #undo.pulse{animation:upulse .6s ease-in-out infinite alternate}
  @keyframes upulse{to{transform:scale(1.06);box-shadow:0 0 0 1px #23252d,0 0 22px rgba(74,168,255,.9)}}
  #hintBtn em{font:800 11px var(--mono);font-style:normal;position:absolute;top:-8px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#000;color:var(--y);display:flex;align-items:center;justify-content:center;border:2px solid var(--y)}
  footer button:active,.nav:active{transform:scale(.97)}
  #tip{position:absolute;left:0;right:0;bottom:40px;text-align:center;font:600 11px var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:#9a9cab;pointer-events:none;transition:opacity .6s}
  /* overlays */
  .screen{position:fixed;inset:0;z-index:6;display:none;background:rgba(5,5,7,.97);touch-action:none}
  .screen.show{display:block;animation:fadein .25s both}
  .screen .inner{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
  .scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:10px 2px 6px;-webkit-overflow-scrolling:touch}
  .hrow{display:flex;gap:8px;align-items:stretch}
  .hrow .tile{flex:1}
  .hrow .t-rank{flex:1.6;background:var(--o);color:#000;padding:0 14px;gap:3px}
  .hrow .t-rank b{font-size:26px}
  .hrow .t-hearts{width:72px;flex:none;border-radius:50%;background:var(--c);align-items:center;gap:3px}
  .hrow .xbtn{width:56px;flex:none;height:72px;border-radius:22px;border:3px solid #000;background:#14151b;color:#fff;font-size:22px;box-shadow:0 0 0 1px #23252d}
  .daily{margin:12px 0 4px;border-radius:24px;border:3px solid #000;box-shadow:0 0 0 1px #23252d,inset 0 0 0 2px var(--line);background:var(--ink);padding:14px 16px;display:flex;align-items:center;gap:14px}
  .daily .l{flex:1}
  .daily b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .daily .sub{font:600 11px var(--mono);letter-spacing:.12em;color:#9a9cab;margin-top:4px}
  .daily button{height:52px;padding:0 20px;border-radius:18px;border:3px solid #000;background:var(--y);color:#000;font:800 14px var(--num);letter-spacing:.1em}
  .daily button.done{background:#1d1f27;color:var(--y)}
  .chh{display:flex;align-items:baseline;gap:10px;margin:18px 2px 8px;color:var(--ac)}
  .chh b{font:800 13px var(--mono);letter-spacing:.16em}
  .chh span{font:800 20px var(--num);letter-spacing:.02em;flex:1}
  .chh em{font:700 11px var(--mono);font-style:normal;color:#9a9cab;letter-spacing:.1em}
  .lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lt{aspect-ratio:1;border-radius:18px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;background:#15161c;color:#fff;font:800 20px var(--num);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
  .lt i{font-style:normal;font-size:8px;letter-spacing:1px;line-height:1;height:9px}
  .lt.s1{background:var(--b);color:#000} .lt.s2{background:var(--o);color:#000} .lt.s3{background:var(--y);color:#000}
  .lt.cur{outline:3px solid #fff;outline-offset:2px}
  .lt.new{box-shadow:0 0 0 1px #23252d,0 0 16px var(--ac);animation:newpulse 1.6s ease-in-out infinite alternate}
  @keyframes newpulse{to{transform:scale(1.05)}}
  .lt.lock{opacity:.28;pointer-events:none}
  .lt.h::after{content:'H';position:absolute;top:2px;right:4px;font:800 9px var(--mono);color:#000;background:#fff;border-radius:4px;padding:0 3px}
  .hfoot{display:flex;gap:8px;padding-top:8px}
  .hfoot button{flex:1;height:52px;border-radius:18px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;font:800 12px var(--num);letter-spacing:.08em;color:#000;background:var(--b)}
  .hfoot button.on{background:var(--r)} .hfoot button.snd{background:var(--y)} .hfoot button.snd.off{background:#1d1f27;color:#9a9cab}
  .lk h3{margin:16px 2px 8px;font:800 12px var(--mono);letter-spacing:.16em;color:#9a9cab}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{border-radius:18px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;background:#14151b;color:#fff;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font:800 11px var(--mono);letter-spacing:.1em}
  .opt.sel{outline:3px solid #fff;outline-offset:2px}
  .opt.locked{opacity:.4}
  .opt .sw{width:42px;height:42px;border-radius:50%}
  .opt .st{width:56px;height:14px;border-radius:7px;display:flex;overflow:hidden}
  .opt .st i{flex:1}
  .opt small{opacity:.7;font-size:9px}
  #locker{background:#050507}
  #intro{background:rgba(5,5,7,.9)}
  #intro .inner{align-items:center;justify-content:center;text-align:center;gap:14px}
  #intro canvas{width:120px;height:120px}
  #intro small{color:var(--ac);opacity:1;font-size:11px}
  #intro h2{margin:0;font-size:38px;font-weight:800;letter-spacing:-.03em;color:var(--ac)}
  #intro p{margin:0;max-width:300px;color:#c9cad6;font:500 16px/1.4 var(--num)}
  #intro button{margin-top:10px;height:56px;padding:0 40px;border-radius:20px;border:3px solid #000;background:var(--ac);color:#000;font:800 16px var(--num);letter-spacing:.1em}
  /* victory screen */
  #victory{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(5,5,7,.8);opacity:0}
  #victory.show{display:flex;animation:fadein .35s forwards}
  @keyframes fadein{to{opacity:1}}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes shine{to{background-position:200% 0}}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .vwrap{position:relative;width:min(360px,calc(100% - 28px));display:flex;flex-direction:column;gap:12px;text-align:center}
  #vsec{font:600 11px var(--mono);letter-spacing:.2em;color:#9a9cab;animation:rise .4s both}
  #victory::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.6),transparent 60%);animation:vflash .7s ease-out forwards}
  @keyframes vflash{from{opacity:1}to{opacity:0}}
  #vtitle{margin:0;font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
  #vtitle span{display:inline-block;color:transparent;
    background:linear-gradient(90deg,#ff9f1c,#ff3b30,#ff2e93,#a56bff,#3d63ff,#4aa8ff,#19d3c5,#ffd60a,#ff9f1c) 0 0/200% 100%;
    -webkit-background-clip:text;background-clip:text;
    animation:letter .65s cubic-bezier(.2,1.7,.4,1) both,shine 2.4s linear infinite;
    animation-delay:calc(var(--i)*.06s),calc(var(--i)*-.3s)}
  @keyframes letter{from{transform:translateY(-50px) scale(.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
  .stars{display:flex;justify-content:center;gap:10px}
  .stars i{position:relative;display:inline-block;font-style:normal;font-size:52px;line-height:1;color:#23252d;animation:rise .4s .3s both}
  .stars i.on{color:var(--y);--d:calc(.35s + var(--k)*.22s);
    animation:starIn .8s cubic-bezier(.2,1.5,.4,1) both,glow 1.5s ease-in-out infinite alternate;
    animation-delay:var(--d),calc(var(--d) + .9s)}
  .stars i.on::after{content:'';position:absolute;left:50%;top:54%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    border:3px solid var(--y);opacity:0;animation:ring .8s ease-out forwards;animation-delay:calc(var(--d) + .3s)}
  @keyframes starIn{
    0%{transform:scale(0) rotate(-200deg);opacity:0;filter:brightness(2);text-shadow:0 0 0 rgba(255,214,10,0)}
    55%{transform:scale(1.6) rotate(18deg);opacity:1;filter:brightness(1.7);text-shadow:0 0 34px rgba(255,214,10,1),0 0 70px rgba(255,160,20,.8)}
    100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1);text-shadow:0 0 18px rgba(255,214,10,.7)}}
  @keyframes glow{from{text-shadow:0 0 18px rgba(255,214,10,.7)}to{text-shadow:0 0 34px rgba(255,214,10,1),0 0 60px rgba(255,160,20,.7)}}
  @keyframes ring{0%{transform:scale(.4);opacity:.95}100%{transform:scale(5);opacity:0}}
  .vstats{display:flex;gap:8px;justify-content:center}
  .vstats .tile{animation:tilepop .6s cubic-bezier(.2,1.5,.4,1) both}
  .vstats .tile:nth-child(1){animation-delay:.15s} .vstats .tile:nth-child(2){animation-delay:.25s} .vstats .tile:nth-child(3){animation-delay:.35s}
  @keyframes tilepop{from{transform:translateY(30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
  .t-eff{flex:1;background:var(--o);color:#000;padding:0 14px;gap:3px}
  #vchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:0}
  #vchips span{font:800 10px var(--mono);letter-spacing:.12em;padding:6px 10px;border-radius:999px;background:var(--y);color:#000;animation:pop .5s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(.9s + var(--k)*.15s)}
  #vchips span.b{background:var(--b)} #vchips span.m{background:#ff2e93} #vchips span.p{background:#a56bff}
  #vnext{height:62px;border-radius:22px;border:3px solid #000;background:var(--y);color:#000;font:800 18px var(--num);letter-spacing:.1em;
    box-shadow:0 0 0 1px #23252d;animation:rise .5s 1s both,nudge 1.6s 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:scale(1);box-shadow:0 0 0 1px #23252d,0 0 0 rgba(255,214,10,0)}
    50%{transform:scale(1.03);box-shadow:0 0 0 1px #23252d,0 0 28px rgba(255,214,10,.55)}}
  .vrow{display:flex;gap:8px;animation:rise .5s 1.1s both}
  .vrow button{flex:1;height:46px;border-radius:18px;border:2px solid var(--line);background:transparent;color:#c9cad6;font:700 13px var(--mono);letter-spacing:.16em}
  #vnext:active,.vrow button:active{transform:scale(.97)}
  /* screen shake + flash on win */
  .shake{animation:shake .55s ease-out}
  @keyframes shake{
    0%{transform:translate(0,0)} 8%{transform:translate(-10px,5px) rotate(-.5deg)} 18%{transform:translate(9px,-6px) rotate(.5deg)}
    28%{transform:translate(-8px,-4px) rotate(-.4deg)} 40%{transform:translate(6px,6px) rotate(.3deg)} 52%{transform:translate(-5px,3px)}
    64%{transform:translate(4px,-3px)} 76%{transform:translate(-3px,2px)} 88%{transform:translate(2px,-1px)} 100%{transform:translate(0,0)}}
  #flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#fff;opacity:0}
  #flash.go{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:.4}100%{opacity:0}}
  /* update toast */
  #upd{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top) + 96px);width:min(360px,calc(100% - 28px));
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-radius:20px;text-align:left;
    border:3px solid #000;background:var(--y);color:#000;box-shadow:0 0 0 1px #23252d,0 12px 32px rgba(0,0,0,.55);
    animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
  #upd[hidden]{display:none}
  #upd small{display:block;margin-bottom:2px}
  #upd b{font:800 17px var(--num);letter-spacing:.08em}
  #upd i{font-style:normal;font-size:28px;line-height:1}
  #upd:active{transform:translateX(-50%) scale(.98)}
  @keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="tile t-level">
      <button class="nav" id="prev" aria-label="Previous level">&#8249;</button>
      <button class="mid" id="lvlBtn" aria-label="Level map"><small id="lvlLbl">Level</small><b id="lvl">01</b></button>
      <button class="nav" id="next" aria-label="Next level">&#8250;</button>
    </div>
    <div class="tile t-moves"><small>Moves</small><b id="mv">0</b></div>
    <div class="tile t-par"><small>Par</small><b id="par" style="font-size:28px">0</b></div>
  </header>
  <div id="prog"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <button class="chip" id="menuBtn" aria-label="Level map"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <button class="chip" id="sndBtn" aria-label="Sound"><svg viewBox="0 0 24 24" id="sndIcon"></svg></button>
    <div id="status" class="info"></div>
    <div id="tip">Swipe anywhere / paint every tile</div>
  </div>
  <footer>
    <button id="undo">UNDO</button>
    <button id="hintBtn">HINT<em id="hcount">3</em></button>
    <button id="restart">RESTART</button>
  </footer>
</div>
<div id="flash"></div>
<button id="upd" hidden><span><small>Update ready</small><b>TAP TO RELOAD</b></span><i>&#8635;</i></button>

<div id="home" class="screen"><div class="inner">
  <div class="hrow">
    <div class="tile t-rank"><small>Rank</small><b id="hrank">CADET</b></div>
    <div class="tile t-moves"><small>Stars</small><b id="hstars">0</b></div>
    <div class="tile t-hearts"><small>Hints</small><b id="hhints" style="font-size:28px">3</b></div>
    <button class="xbtn" id="hclose" aria-label="Close">&#10005;</button>
  </div>
  <div class="scroll" id="hscroll">
    <div class="daily" id="daily"></div>
    <div id="chapters"></div>
  </div>
  <div class="hfoot">
    <button id="hlocker">LOCKER</button>
    <button id="hhard">HARD: OFF</button>
    <button id="hsound" class="snd">SOUND: ON</button>
  </div>
</div></div>

<div id="locker" class="screen"><div class="inner">
  <div class="hrow">
    <div class="tile t-rank"><small>Rank</small><b id="lrank">CADET</b></div>
    <div class="tile t-moves"><small>Next rank</small><b id="lnext" style="font-size:22px">--</b></div>
    <button class="xbtn" id="lclose" aria-label="Close">&#10005;</button>
  </div>
  <div class="scroll lk">
    <h3>BALL</h3><div class="opts" id="skins"></div>
    <h3>TRAIL</h3><div class="opts" id="trails"></div>
  </div>
</div></div>

<div id="intro" class="screen"><div class="inner">
  <canvas id="introCv" width="240" height="240"></canvas>
  <small id="introSec"></small>
  <h2 id="introTitle"></h2>
  <p id="introText"></p>
  <button id="introGo">GOT IT</button>
</div></div>

<div id="victory" role="dialog" aria-live="polite">
  <canvas id="fx"></canvas>
  <div class="vwrap">
    <div id="vsec"></div>
    <h2 id="vtitle">CLEARED</h2>
    <div class="stars" id="vstars"></div>
    <div class="vstats">
      <div class="tile t-moves"><small>Moves</small><b id="vmv">0</b></div>
      <div class="tile t-par"><small>Par</small><b id="vpar" style="font-size:28px">0</b></div>
      <div class="tile t-eff"><small>Best</small><b id="vbest">0</b></div>
    </div>
    <div id="vchips"></div>
    <button id="vnext">NEXT LEVEL</button>
    <div class="vrow"><button id="vreplay">REPLAY</button><button id="vmap">MAP</button></div>
  </div>
</div>
<script>
(() => {
'use strict';

// Stamped by `node bump-version.js` (which also writes version.json). Do not edit by hand.
const VERSION = '20261027021100';

/*ENGINE-START*/
/* Shared engine: no DOM. Embedded into index.html between ENGINE markers and
   evaluated by build-levels.js in Node. */
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // up, right, down, left
const K_NORMAL = 0, K_STICKY = 1, K_ONEWAY = 2, K_PORTAL = 3;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function newLevel(W, H){
  const N = W * H;
  return { W, H, N, start: { x: 0, y: 0 }, floor: new Uint8Array(N), kind: new Uint8Array(N),
           dir: new Uint8Array(N), mate: new Int16Array(N).fill(-1), moves: [], count: 0, n: 0, par: 0, rating: 1 };
}

/* Slide from (x,y) in direction d. Returns cells entered as [x, y, jumped]:
   jumped=1 marks the arrival cell of a portal teleport. Rules:
   - walls / edges stop the ball
   - one-way tiles can only be entered moving in their direction
   - sticky tiles stop the ball when entered
   - portals teleport to their twin and the slide continues (once per slide) */
function slide(lv, x, y, d){
  const { W, H, floor, kind, dir, mate } = lv, dx = DIRS[d][0], dy = DIRS[d][1], path = [];
  let tp = false;
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) break;
    const i = ny * W + nx;
    if (!floor[i]) break;
    const k = kind[i];
    if (k === K_ONEWAY && dir[i] !== d) break;
    x = nx; y = ny; path.push([x, y, 0]);
    if (k === K_STICKY) break;
    if (k === K_PORTAL && !tp){
      tp = true;
      const m = mate[i]; x = m % W; y = (m / W) | 0;
      path.push([x, y, 1]);
    }
  }
  return path;
}

function goalOf(lv){
  if (lv._goal === undefined){
    let g = 0n; const bits = [];
    for (let i = 0; i < lv.N; i++){ bits.push(1n << BigInt(i)); if (lv.floor[i]) g |= bits[i]; }
    lv._bits = bits; lv._goal = g;
  }
  return lv._goal;
}

function verify(lv){
  let x = lv.start.x, y = lv.start.y;
  const seen = new Uint8Array(lv.N); seen[y * lv.W + x] = 1;
  for (const d of lv.moves){
    const p = slide(lv, x, y, d);
    if (!p.length) return false;
    for (const c of p) seen[c[1] * lv.W + c[0]] = 1;
    const l = p[p.length - 1]; x = l[0]; y = l[1];
  }
  for (let i = 0; i < lv.N; i++) if (lv.floor[i] && !seen[i]) return false;
  return true;
}

/* ---------- construction ----------
   Walk a legal solution into existence, deciding walls and special tiles as we
   go. The result is verified by replaying the recorded moves with slide(). */
function attempt(rng, W, H, M, opt){
  const N = W * H, idx = (x, y) => y * W + x, inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const wall = new Uint8Array(N), vis = new Uint8Array(N), kind = new Uint8Array(N), dir = new Uint8Array(N);
  const mate = new Int16Array(N).fill(-1), entry = new Uint8Array(N), thr = new Uint8Array(N);
  let x = Math.floor(rng() * W), y = Math.floor(rng() * H);
  const start = { x, y }, sidx = idx(x, y);
  vis[sidx] = 1; let count = 1; const moves = [];

  function run(cx, cy, d){
    const dx = DIRS[d][0], dy = DIRS[d][1], cells = [];
    for (;;){
      cx += dx; cy += dy;
      if (!inb(cx, cy)) break;
      const i = idx(cx, cy);
      if (wall[i]) break;
      const k = kind[i];
      if (k === K_ONEWAY && dir[i] !== d) break;
      if (k === K_PORTAL) break;
      cells.push(i);
      if (k === K_STICKY) break;
    }
    return cells;
  }
  // 0: the ball would keep going, 1: sticky stop, 2: stops (edge/wall/one-way), 3: stops once beyond cell becomes a wall
  function stopOk(e, d){
    if (kind[e] === K_STICKY) return 1;
    const bx = (e % W) + DIRS[d][0], by = ((e / W) | 0) + DIRS[d][1];
    if (!inb(bx, by)) return 2;
    const b = idx(bx, by);
    if (wall[b]) return 2;
    if (!vis[b]) return 3;
    if (kind[b] === K_ONEWAY && dir[b] !== d) return 2;
    return 0;
  }
  function mark(i, d, through){
    if (!vis[i]){ vis[i] = 1; count++; }
    if (d >= 0) entry[i] |= 1 << d;
    if (through) thr[i] = 1;
  }
  function wallBeyond(e, d){
    const bx = (e % W) + DIRS[d][0], by = ((e / W) | 0) + DIRS[d][1];
    if (inb(bx, by)){ const b = idx(bx, by); if (!vis[b]) wall[b] = 1; }
  }

  for (let s = 0; s < M; s++){
    const opts = [];
    for (let d = 0; d < 4; d++){
      const cells = run(x, y, d); let nw = 0;
      for (let L = 1; L <= cells.length; L++){
        const e = cells[L - 1];
        if (!vis[e]) nw++;
        if (nw === 0) continue;
        if (stopOk(e, d)) opts.push({ t: 0, d, L, nw, cells });
        if (opt.sticky > 0 && kind[e] === K_NORMAL && !thr[e] && e !== sidx) opts.push({ t: 1, d, L, nw, cells });
      }
    }
    if (opt.portal > 0){
      for (let tr = 0; tr < 6; tr++){
        const d = (rng() * 4) | 0, cells = run(x, y, d);
        const cand = [];
        for (let j = 0; j < cells.length; j++) if (!vis[cells[j]] && kind[cells[j]] === K_NORMAL) cand.push(j);
        if (!cand.length) continue;
        const j = cand[(rng() * cand.length) | 0], A = cells[j];
        let B = -1;
        for (let k = 0; k < 10; k++){
          const c = (rng() * N) | 0;
          if (c !== A && !vis[c] && !wall[c] && cells.slice(0, j + 1).indexOf(c) < 0){ B = c; break; }
        }
        if (B < 0) continue;
        vis[A] = vis[B] = 1; kind[A] = kind[B] = K_PORTAL;
        const cells2 = run(B % W, (B / W) | 0, d), ends = [];
        for (let L2 = 0; L2 <= cells2.length; L2++){
          const e = L2 === 0 ? B : cells2[L2 - 1];
          if (cells2.slice(0, L2).indexOf(A) >= 0) break;
          if (stopOk(e, d)) ends.push(L2);
        }
        vis[A] = vis[B] = 0; kind[A] = kind[B] = K_NORMAL;
        if (!ends.length) continue;
        opts.push({ t: 2, d, A, j, B, L2: ends[(rng() * ends.length) | 0], cells, cells2 });
      }
    }
    if (!opts.length) break;
    let total = 0;
    const wt = o => o.t === 0 ? o.nw + 0.5 : o.t === 1 ? opt.sticky * (o.nw + 0.5) : opt.portal * 3;
    for (const o of opts) total += wt(o);
    let r = rng() * total, pick = opts[opts.length - 1];
    for (const o of opts){ r -= wt(o); if (r <= 0){ pick = o; break; } }
    const o = pick, d = o.d;

    if (o.t === 2){
      kind[o.A] = kind[o.B] = K_PORTAL; mate[o.A] = o.B; mate[o.B] = o.A;
      for (let t = 0; t <= o.j; t++) mark(o.cells[t], d, t < o.j);
      mark(o.B, -1, false);
      for (let t = 0; t < o.L2; t++) mark(o.cells2[t], d, t < o.L2 - 1);
      const e = o.L2 === 0 ? o.B : o.cells2[o.L2 - 1];
      if (kind[e] !== K_STICKY) wallBeyond(e, d);
      x = e % W; y = (e / W) | 0;
    } else {
      for (let t = 0; t < o.L; t++){
        const c = o.cells[t], through = t < o.L - 1;
        const eligible = through && kind[c] === K_NORMAL && c !== sidx && (entry[c] & ~(1 << d)) === 0;
        mark(c, d, through);
        if (eligible && opt.oneway > 0 && rng() < opt.oneway){ kind[c] = K_ONEWAY; dir[c] = d; }
      }
      const e = o.cells[o.L - 1];
      if (o.t === 1) kind[e] = K_STICKY;
      else if (kind[e] !== K_STICKY) wallBeyond(e, d);
      x = e % W; y = (e / W) | 0;
    }
    moves.push(d);
  }
  const lv = newLevel(W, H);
  lv.start = start; lv.moves = moves; lv.count = count;
  for (let i = 0; i < N; i++){
    if (vis[i]){ lv.floor[i] = 1; lv.kind[i] = kind[i]; lv.dir[i] = dir[i]; lv.mate[i] = mate[i]; }
  }
  return verify(lv) ? lv : null;
}

function mechCount(lv){
  const m = { sticky: 0, oneway: 0, portal: 0 };
  for (let i = 0; i < lv.N; i++){
    if (!lv.floor[i]) continue;
    if (lv.kind[i] === K_STICKY) m.sticky++;
    else if (lv.kind[i] === K_ONEWAY) m.oneway++;
    else if (lv.kind[i] === K_PORTAL) m.portal += 0.5;
  }
  return m;
}

/* ---------- difficulty ---------- */
function analyze(lv, cap){
  const W = lv.W, goal = goalOf(lv), bits = lv._bits;
  const s0 = lv.start.y * W + lv.start.x, m0 = bits[s0];
  const ids = new Map(), pos = [s0], masks = [m0], edges = [[]], depth = [0];
  ids.set(m0.toString(36) + ':' + s0, 0);
  let opt = -1, capped = false;
  for (let qi = 0; qi < pos.length; qi++){
    const x = pos[qi] % W, y = (pos[qi] / W) | 0;
    for (let d = 0; d < 4; d++){
      const p = slide(lv, x, y, d);
      if (!p.length) continue;
      let m = masks[qi];
      for (const c of p) m |= bits[c[1] * W + c[0]];
      const l = p[p.length - 1], np = l[1] * W + l[0], k = m.toString(36) + ':' + np;
      let id = ids.get(k);
      if (id === undefined){
        if (pos.length >= cap){ capped = true; continue; }
        id = pos.length; ids.set(k, id); pos.push(np); masks.push(m); edges.push([]); depth.push(depth[qi] + 1);
        if (m === goal && opt < 0) opt = depth[id];
      }
      edges[qi].push(id);
    }
  }
  const S = pos.length, rev = pos.map(() => []);
  edges.forEach((es, i) => es.forEach(j => rev[j].push(i)));
  const alive = new Uint8Array(S), st = [];
  for (let i = 0; i < S; i++) if (masks[i] === goal){ alive[i] = 1; st.push(i); }
  while (st.length){ const j = st.pop(); for (const i of rev[j]) if (!alive[i]){ alive[i] = 1; st.push(i); } }
  let aliveN = 0, br = 0;
  for (let i = 0; i < S; i++){ aliveN += alive[i]; br += edges[i].length; }
  const first = edges[0];
  return { S, opt, capped, deadFrac: (S - aliveN) / S, branch: br / S,
           first: first.length, firstTraps: first.filter(j => !alive[j]).length };
}

function difficultyScore(a){
  let s = Math.log2(a.S + 1) + 6 * (a.capped ? 0.5 : a.deadFrac) + 2 * Math.max(0, a.branch - 1.6);
  if (a.capped) s += 3;
  return s;
}

function targetT(n){
  let T = 1 - Math.exp(-n / 38);
  if (n % 10 === 0) T = Math.min(1, T * 1.25 + 0.08);       // boss
  else if (n % 5 === 0) T *= 0.7;                           // breather
  else if ((n - 1) % 10 === 0) T *= 0.75;                   // chapter opener
  return T;
}
function targetScore(n){ return 4.5 + 13 * targetT(n); }

function paramsFor(n){
  const c = Math.floor((n - 1) / 10);
  const W = Math.min(9, 4 + Math.floor((n - 1) / 8)), H = Math.min(13, W + 4);
  const M = Math.min(20, 4 + Math.floor(n * 0.33));
  const mech = { sticky: 0, oneway: 0, portal: 0 };
  if (c === 1) mech.sticky = 1;
  else if (c === 2){ mech.oneway = 0.35; mech.sticky = 0.3; }
  else if (c === 3){ mech.portal = 1; mech.sticky = 0.25; mech.oneway = 0.15; }
  else if (c >= 4){ mech.sticky = 0.6; mech.oneway = 0.25; mech.portal = 0.7; }
  return { W, H, M, mech, c };
}

function meetsMechanic(lv, c){
  const m = mechCount(lv);
  if (c === 1) return m.sticky >= 1;
  if (c === 2) return m.oneway >= 1;
  if (c === 3) return m.portal >= 1;
  if (c >= 4) return (m.sticky > 0) + (m.oneway > 0) + (m.portal > 0) >= 2;
  return true;
}

// Optimal solution by BFS from the start; sets lv.moves and lv.par. Returns false if not found within cap.
function solveOptimal(lv, cap){
  goalOf(lv);
  const p0 = lv.start.y * lv.W + lv.start.x;
  const s = new Search(lv, p0, lv._bits[p0], cap);
  while (s.status === 'run') s.step(1e9);
  if (s.status !== 'alive') return false;
  lv.moves = s.path; lv.par = s.path.length;
  return true;
}

/* Deterministic: same n (or seed) always yields the same level. */
function generateLevel(n, o){
  o = o || {};
  const cands = o.candidates || 24, cap = o.cap || 12000;
  const P = paramsFor(o.like || n), rng = mulberry32((o.seed !== undefined ? o.seed : n) * 7919 + 101);
  const target = targetScore(o.like || n);
  let best = null, bestD = 1e9, fallback = null;
  for (let i = 0; i < cands; i++){
    const M = Math.max(3, P.M + ((rng() * 5) | 0) - 2);
    const lv = attempt(rng, P.W, P.H, M, P.mech);
    if (!lv) continue;
    if (lv.count < 0.42 * lv.N) continue;
    if (!fallback) fallback = lv;
    if (!meetsMechanic(lv, P.c)) continue;
    const a = analyze(lv, cap);
    if (a.opt < 0) continue;
    const sc = difficultyScore(a);
    let dist = Math.abs(sc - target) - lv.count * 0.01;
    if (n >= 12 && !a.capped && a.deadFrac < 0.08) dist += 3;   // past the tutorial, wrong moves must be able to strand you
    if (dist < bestD){ bestD = dist; best = lv; lv._a = a; lv._score = sc; }
  }
  const lv = best || fallback;
  if (!lv) return null;
  lv.n = n;
  if (!solveOptimal(lv, cap * 3)) lv.par = lv.moves.length;
  const sc = lv._score !== undefined ? lv._score : target;
  lv.rating = Math.max(1, Math.min(5, Math.round((sc - 4) / 3.4) + 1));
  return lv;
}

/* ---------- search (trap detection, hints, optimal solve) ---------- */
function Search(lv, pos, mask, cap){
  this.lv = lv; this.cap = cap || 30000; this.goal = goalOf(lv);
  this.nodes = [{ pos, mask, par: -1, mv: -1 }];
  this.seen = new Set([mask.toString(36) + ':' + pos]);
  this.qi = 0; this.path = [];
  this.status = mask === this.goal ? 'alive' : 'run';
}
Search.prototype.step = function(ms){
  const lv = this.lv, W = lv.W, bits = lv._bits, end = Date.now() + ms;
  while (this.status === 'run'){
    if (Date.now() > end) return;
    if (this.qi >= this.nodes.length){ this.status = 'dead'; return; }
    const nd = this.nodes[this.qi], x = nd.pos % W, y = (nd.pos / W) | 0;
    for (let d = 0; d < 4; d++){
      const p = slide(lv, x, y, d);
      if (!p.length) continue;
      let m = nd.mask;
      for (const c of p) m |= bits[c[1] * W + c[0]];
      const l = p[p.length - 1], np = l[1] * W + l[0], k = m.toString(36) + ':' + np;
      if (this.seen.has(k)) continue;
      if (this.nodes.length >= this.cap){ this.status = 'unknown'; return; }
      this.seen.add(k);
      this.nodes.push({ pos: np, mask: m, par: this.qi, mv: d });
      if (m === this.goal){
        const out = []; let i = this.nodes.length - 1;
        while (this.nodes[i].par >= 0){ out.push(this.nodes[i].mv); i = this.nodes[i].par; }
        this.path = out.reverse(); this.status = 'alive'; return;
      }
    }
    this.qi++;
  }
};

/* ---------- encoding (baked levels) ---------- */
function encodeLevel(lv){
  const rows = [], arrows = '^>v<';
  for (let y = 0; y < lv.H; y++){
    let r = '';
    for (let x = 0; x < lv.W; x++){
      const i = y * lv.W + x;
      if (!lv.floor[i]) r += '#';
      else if (x === lv.start.x && y === lv.start.y) r += '@';
      else if (lv.kind[i] === K_STICKY) r += 'g';
      else if (lv.kind[i] === K_ONEWAY) r += arrows[lv.dir[i]];
      else if (lv.kind[i] === K_PORTAL){
        const m = lv.mate[i];
        // pair letter = index of the lower cell of the pair
        r += String.fromCharCode(65 + pairIndex(lv, Math.min(i, m)));
      }
      else r += '.';
    }
    rows.push(r);
  }
  return [lv.W, lv.par, lv.rating, lv.moves.join(''), rows.join('/')].join('|');
}
function pairIndex(lv, lo){
  let k = 0;
  for (let i = 0; i < lo; i++) if (lv.floor[i] && lv.kind[i] === K_PORTAL && lv.mate[i] > i) k++;
  return k;
}
function decodeLevel(str, n){
  const [Ws, par, rating, moves, rowsS] = str.split('|');
  const rows = rowsS.split('/'), W = +Ws, H = rows.length, lv = newLevel(W, H);
  const arrows = '^>v<', pend = {};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const c = rows[y][x], i = y * W + x;
    if (c === '#') continue;
    lv.floor[i] = 1; lv.count++;
    if (c === '@') lv.start = { x, y };
    else if (c === 'g') lv.kind[i] = K_STICKY;
    else if (arrows.indexOf(c) >= 0){ lv.kind[i] = K_ONEWAY; lv.dir[i] = arrows.indexOf(c); }
    else if (c >= 'A' && c <= 'Z'){
      lv.kind[i] = K_PORTAL;
      if (pend[c] !== undefined){ lv.mate[i] = pend[c]; lv.mate[pend[c]] = i; } else pend[c] = i;
    }
  }
  lv.par = +par; lv.rating = +rating; lv.n = n;
  lv.moves = moves.split('').map(Number);
  return lv;
}

/* ---------- sound (synthesised, no assets) ---------- */
const SFX = (function(){
  let ac = null, master = null, nbuf = null;
  const on = () => S.set.sound !== false;
  function ctx(){
    if (!on()) return null;
    if (!ac){
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { ac = new C(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination); } catch (e) { ac = null; return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, dur, type, vol, delay, f2){
    const a = ctx(); if (!a) return;
    const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .15, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, f0, f1, vol){
    const a = ctx(); if (!a) return;
    if (!nbuf){ nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = nbuf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  const SC = [0, 2, 4, 7, 9];
  const note = i => 261.63 * Math.pow(2, (SC[i % 5] + 12 * Math.floor(i / 5)) / 12);
  const arp = (steps, base, type, vol, gap) => steps.forEach((s, i) => tone(base * Math.pow(2, s / 12), .32, type, vol, i * gap));
  return {
    unlock(){ ctx(); },
    tick(i){ tone(note(Math.min(i, 14)) * 2, .09, 'triangle', .07); },
    whoosh(len){ noise(.14 + len * .02, 350, 1900, .14); },
    stop(){ tone(120, .16, 'sine', .28, 0, 55); },
    bump(){ tone(95, .09, 'square', .06, 0, 60); },
    undo(){ tone(520, .1, 'triangle', .1, 0, 320); },
    trapped(){ tone(170, .4, 'sawtooth', .09, 0, 90); tone(160, .4, 'sawtooth', .07, .09, 80); },
    warp(){ tone(280, .2, 'sine', .13, 0, 1300); },
    click(){ tone(720, .05, 'triangle', .08); },
    hint(){ tone(880, .12, 'sine', .1); tone(1320, .22, 'sine', .08, .08); },
    star(k){ tone(note(5 + k * 2) * 2, .4, 'sine', .15); tone(note(5 + k * 2) * 4, .25, 'triangle', .05, .02); },
    win(){ arp([0, 4, 7, 12, 16, 19], 523.25, 'triangle', .1, .07); },
    best(){ arp([12, 16, 19, 24], 523.25, 'sine', .12, .09); },
    rank(){ arp([0, 7, 12, 16, 19, 24], 392, 'triangle', .11, .09); },
  };
})();

/* ---------- WebGL paint shader ----------
   Renders only the painted cells (plus a one-cell margin for glow) into an
   offscreen canvas which is then composited onto the 2D canvas.             */
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uSize; uniform vec2 uGrid; uniform float uCell; uniform float uTime; uniform float uWin;
uniform sampler2D uMask; uniform sampler2D uFlash;
vec4 mk(vec2 c){ if(c.x<0.||c.y<0.||c.x>=uGrid.x||c.y>=uGrid.y) return vec4(0.); return texture2D(uMask,(c+.5)/uGrid); }
float fl(vec2 c){ if(c.x<0.||c.y<0.||c.x>=uGrid.x||c.y>=uGrid.y) return 0.; return texture2D(uFlash,(c+.5)/uGrid).r; }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y);
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y);
  vec2 g = px / uCell - 1.0;
  vec2 c = floor(g), f = g - c;
  vec4 m = mk(c);
  vec4 res = vec4(0.);
  if (m.a > .5) {
    vec3 col = m.rgb;
    float pu=mk(c+vec2(0.,-1.)).a, pr=mk(c+vec2(1.,0.)).a, pd=mk(c+vec2(0.,1.)).a, pl=mk(c+vec2(-1.,0.)).a;
    float ext = 9.;
    if (pl<.5) ext=min(ext,f.x);
    if (pr<.5) ext=min(ext,1.-f.x);
    if (pu<.5) ext=min(ext,f.y);
    if (pd<.5) ext=min(ext,1.-f.y);
    float cover = 1., dd = 9.;
    bool right = f.x>=.5, bot = f.y>=.5;
    float nx = right ? pr : pl;
    float ny = bot ? pd : pu;
    float r = .26;
    if (nx<.5 && ny<.5) {
      vec2 cc = vec2(right?1.-r:r, bot?1.-r:r);
      bool inCorner = (right ? f.x>cc.x : f.x<cc.x) && (bot ? f.y>cc.y : f.y<cc.y);
      if (inCorner) {
        dd = length(f-cc)-r;
        float aa = 1.2/uCell;
        cover = 1.-smoothstep(-aa,aa,dd);
        ext = min(ext,-dd);
      }
    }
    float t = uTime;
    vec2 w = px/uCell;
    float n = noise(w*1.8+vec2(t*.30,-t*.22))*.6 + noise(w*4.5+vec2(-t*.45,t*.35))*.4;
    float band = .5+.5*sin((w.x*.9+w.y*1.3)*2.2 - t*1.6);
    vec3 base = col*(.74+.42*n) + col*.22*band*band;
    base += vec3(.10)*smoothstep(.55,1.,n);
    float rim = smoothstep(.10,0.,ext);
    base = mix(base, col*1.25+.12, rim*.8);
    base *= mix(.80,1.,smoothstep(0.,.35,ext));
    base += vec3(1.)*fl(c)*.55;
    if (uWin >= 0.) {
      float diag = g.x+g.y;
      float wave = exp(-pow((diag-uWin*(uGrid.x+uGrid.y)*1.4)*.6,2.));
      base += vec3(.9)*wave;
      base *= 1.+.10*sin(uWin*5.);
    }
    res = vec4(min(base,vec3(1.))*cover, cover);
    if (cover < 1.) {
      float k = exp(-max(dd,0.)*5.5)*.5;
      res += vec4(col*k,k)*(1.-cover);
    }
  } else {
    vec3 acc = vec3(0.); float ga = 0.;
    for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++) {
      if (i==0 && j==0) continue;
      vec2 o = vec2(float(i),float(j));
      vec4 nm = mk(c+o);
      if (nm.a > .5) {
        vec2 q = max(abs(f-(.5+o))-.5, 0.);
        float k = exp(-length(q)*5.5);
        acc += nm.rgb*k; ga += k;
      }
    }
    if (ga > 0.) { float a = clamp(ga*.5,0.,.55); res = vec4(acc/ga*a, a); }

function getLevel(n){

}
const dailyCache = {};
function getDaily(){
  const key = dateKey();
  if (!dailyCache[key]){
    let h = 2166136261;
    for (const ch of key){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const seed = (h >>> 0) % 900000 + 100;
    const like = 22 + new Date().getDay() * 8;           // Sunday is the hardest
    const l = generateLevel(1 + seed % 1000, { seed, like, candidates: 16, cap: 6000 });
    l.rating = Math.max(l.rating, 2);
    dailyCache[key] = l;
  }
  return dailyCache[key];
}

  l.pair = new Int8Array(l.N).fill(-1);
  let k = 0;
  for (let i = 0; i < l.N; i++) if (l.floor[i] && l.kind[i] === K_PORTAL && l.pair[i] < 0 && l.mate[i] >= 0){ l.pair[i] = l.pair[l.mate[i]] = k++; }
}

/* ---------- search: trap detection + hints ---------- */
function paintedMask(){
  let m = 0n; const bits = lv._bits;
  for (let i = 0; i < lv.N; i++) if (painted[i]) m |= bits[i];
  return m;
}
function startSearch(){

  search.done = false;

  if (!search || search.done) return;
  if (search.status === 'run') search.step(4);
  if (search.status === 'run') return;
  search.done = true;
  if (won) return;
  if (search.status === 'alive'){
    hintPath = search.path;
    if (pendingHint){ pendingHint = false; showHint(); }
  } else if (search.status === 'dead'){
    trapped = true; renderStatus(); updateHud(); SFX.trapped(); buzz([60, 40, 60]);
    if (pendingHint){ pendingHint = false; }
  } else if (pendingHint){
    pendingHint = false; setStatus('NO HINT FOR THIS STATE', 'info', 2000);
  }
}
function showHint(){
  if (!hintPath || !hintPath.length) return;
  S.hints = Math.max(0, S.hints - 1); persist(); updateHud();

}

  if (S.hints <= 0){ setStatus('NO HINTS LEFT', 'bad', 1800); SFX.bump(); return; }
  if (!hintPath){ pendingHint = true; setStatus('THINKING', 'info', 2500); return; }
  showHint();
}

/* ---------- input ---------- */
function tryMove(d){
  if (anim || won || overlayOpen()) return;
  const path = slide(lv, px, py, d);
  if (!path.length){ bump = { d, t0: performance.now() }; SFX.bump(); buzz(15); return; }
  history.push({ x: px, y: py, painted: painted.slice(), stroke: stroke.slice(), moves: moveCount });
  anim = { path, from: [px, py], t0: performance.now(), done: 0, ci: (moveCount + lv.n) % PAL.length };
  hintShown = null; hintPath = null; pendingHint = false; search = null;
  if (trapped){ trapped = false; }

}

function undo(){

/* ---------- update loop ---------- */
const SPEED = 20; // cells per second
function burst(x, y, rgb){
  const col = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 1.5 + Math.random() * 2.5, col });
  }
}

function update(now, dt){
  for (let i = 0; i < flash.length; i++) if (flash[i] > 0) flash[i] = Math.max(0, flash[i] - dt * 2.2);
  if (anim){
    const p = Math.max(0, now - anim.t0) / 1000 * SPEED;
    const total = anim.path.length;
    while (anim.done < total && p >= anim.done + 1){
      const e = anim.path[anim.done], i = e[1] * lv.W + e[0];
      painted[i] = 1; stroke[i] = anim.ci + 1; flash[i] = 1;
      SFX.tick(anim.done);
      if (e[2]){ SFX.warp(); burst(ox + (e[0] + .5) * cs, oy + (e[1] + .5) * cs, PAL[anim.ci]); }
      anim.done++;
    }
    if (anim.done >= total){
      const last = anim.path[total - 1];
      px = last[0]; py = last[1]; moveCount++;
      $('mv').textContent = moveCount;
      burst(ox + (px + .5) * cs, oy + (py + .5) * cs, PAL[anim.ci]);
      SFX.stop(); buzz(12);
      anim = null;
      let all = true;
      for (let i = 0; i < painted.length; i++) if (lv.floor[i] && !painted[i]){ all = false; break; }
      if (all) onWin(); else startSearch();
    }
  }
  for (const q of particles){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .93; q.vy *= .93; q.life -= dt * 2.2; }
  particles = particles.filter(q => q.life > 0);
  pollSearch();
}

/* ---------- winning ---------- */
function onWin(){
  won = true; winStart = performance.now(); search = null;
  const par = lv.par, stars = starsFor(moveCount, par);
  const eff = Math.min(100, Math.round(par / moveCount * 100));
  const chips = [];
  const beforePts = points(), beforeRank = rankIdx(beforePts);
  let prevBest = 0, newBest = false;
  if (mode === 'campaign'){
    const rec = S.lv[lv.n] || (S.lv[lv.n] = { s: 0, b: 0, h: 0 });
    const prevStars = rec.s, first = !rec.s;
    prevBest = rec.b;
    newBest = !rec.b || moveCount < rec.b;
    if (newBest) rec.b = moveCount;
    rec.s = Math.max(rec.s, stars);
    if (S.set.hard) rec.h = 1;
    if (lv.n >= S.max) S.max = lv.n + 1;
    if (first || newBest && rec.b) { /* recorded above */ }
    if (stars === 3 && prevStars < 3){ S.hints = Math.min(9, S.hints + 1); chips.push(['+1 HINT', '']); }
    if (first && lv.n % 10 === 0){ S.hints = Math.min(9, S.hints + 2); chips.push(['SECTOR CLEAR +2 HINTS', 'b']); }
    if (newBest && prevBest) chips.unshift(['NEW BEST', '']);
    if (S.set.hard) chips.push(['HARD CLEAR', 'm']);
  } else {
    const key = dateKey(), rec = S.daily[key] || (S.daily[key] = { s: 0, b: 0 });
    prevBest = rec.b; newBest = !rec.b || moveCount < rec.b;
    const firstToday = !rec.s;
    if (newBest) rec.b = moveCount;
    rec.s = Math.max(rec.s, stars);
    if (firstToday){
      const y = new Date(); y.setDate(y.getDate() - 1);
      S.streak.count = S.streak.last === dateKey(y) ? S.streak.count + 1 : 1;
      S.streak.last = key; S.streak.best = Math.max(S.streak.best, S.streak.count);
      S.hints = Math.min(9, S.hints + 1);
      chips.push(['STREAK ' + pad2(S.streak.count), '']); chips.push(['+1 HINT', 'b']);
    } else if (newBest && prevBest) chips.unshift(['NEW BEST', '']);
  }
  const afterPts = points(), afterRank = rankIdx(afterPts);
  if (afterRank > beforeRank){
    chips.push(['RANK UP: ' + RANKS[afterRank][0], 'p']);
    SKINS.concat(TRAILS).forEach(u => { if (u.r > beforeRank && u.r <= afterRank) chips.push(['NEW: ' + u.name, 'p']); });
  }
  persist();
  winInfo = { stars, eff, chips, best: mode === 'campaign' ? S.lv[lv.n].b : S.daily[dateKey()].b, rankUp: afterRank > beforeRank, newBest: newBest && !!prevBest };
  renderStatus(); updateHud(); renderProg();
  setTimeout(() => { if (won && winStart) shakeScreen(winStart); }, 450);
  const token = winStart;
  setTimeout(() => { if (won && winStart === token) showVictory(); }, 1150);
}

function sparksAt(x, y){

    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 1.5 + Math.random() * 2.5, col: Math.random() < .35 ? '255,255,255' : '255,214,10' });

function piece(x, y, vx, vy){

  return { x, y, vx, vy, r: Math.random() * 6.28, vr: (Math.random() - .5) * 12, w: 6 + Math.random() * 7, h: 5 + Math.random() * 6, col: 'rgb(' + c + ')' };

function startConfetti(stars){
  const d = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  fx.width = Math.round(W * d); fx.height = Math.round(H * d);

    conf.push(piece(W / 2, H * .4, Math.cos(a) * s, Math.sin(a) * s));
  }
  fxEnd = performance.now() + 1500 + stars * 800; fxLast = performance.now();
  cancelAnimationFrame(fxRaf); fxOn = true; fxRaf = requestAnimationFrame(fxFrame);
}

function fxFrame(now){
  const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
  const W = innerWidth, H = innerHeight;
  if (now < fxEnd && Math.random() < .55) conf.push(piece(Math.random() * W, -12, (Math.random() - .5) * 60, 80 + Math.random() * 120));
  fctx.clearRect(0, 0, W, H);
  const damp = Math.pow(.2, dt);
  for (const p of conf){
    p.vx *= damp; p.vy = p.vy * damp + 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.fillStyle = p.col;
    fctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r * 1.7)), p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
    fctx.restore();
  }
  conf = conf.filter(p => p.y < H + 20);
  fctx.globalCompositeOperation = 'lighter';
  for (const s of sparks){
    s.vx *= Math.pow(.05, dt); s.vy *= Math.pow(.05, dt);
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.5;
    if (s.life <= 0) continue;
    const g = fctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
    g.addColorStop(0, 'rgba(' + s.col + ',' + s.life + ')'); g.addColorStop(1, 'rgba(' + s.col + ',0)');
    fctx.fillStyle = g; fctx.beginPath(); fctx.arc(s.x, s.y, s.r * 3, 0, 7); fctx.fill();
  }
  fctx.globalCompositeOperation = 'source-over';
  sparks = sparks.filter(s => s.life > 0);
  if (conf.length || sparks.length || now < fxEnd) fxRaf = requestAnimationFrame(fxFrame);
  else fxOn = false;
}

/* ---------- drawing ---------- */
function cell(x, y){ return x >= 0 && y >= 0 && x < lv.W && y < lv.H && lv.floor[y * lv.W + x] === 1; }

function tilePath(x, y, inset){
  const r = cs * 0.26;
  const u = !cell(x, y - 1), rt = !cell(x + 1, y), d = !cell(x, y + 1), l = !cell(x - 1, y);
  const radii = [u && l ? r : 0, u && rt ? r : 0, d && rt ? r : 0, d && l ? r : 0];
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(ox + x * cs + inset, oy + y * cs + inset, cs - inset * 2, cs - inset * 2, radii);
  else ctx.rect(ox + x * cs + inset, oy + y * cs + inset, cs - inset * 2, cs - inset * 2);
}

/* Special-tile glyphs. c: context, k: kind, d: arrow dir, (gx,gy,sz): tile box, on: painted over? */
function glyph(c, k, d, gx, gy, sz, t, on, pairIdx){
  const cx = gx + sz / 2, cy = gy + sz / 2;
  c.save();
  if (k === K_STICKY){
    const col = on ? 'rgba(12,12,18,.72)' : '#ff2e93';
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(2, sz * .05);
    c.beginPath(); c.roundRect(gx + sz * .24, gy + sz * .24, sz * .52, sz * .52, sz * .12); c.stroke();
    for (const [ax, ay] of [[0, 0], [1, 0], [0, 1], [1, 1]]){ c.beginPath(); c.arc(gx + sz * (.36 + ax * .28), gy + sz * (.36 + ay * .28), sz * .045, 0, 7); c.fill(); }
    c.beginPath(); c.arc(cx, cy, sz * .06 + Math.sin(t * 4) * sz * .01, 0, 7); c.fill();
  } else if (k === K_ONEWAY){
    const col = on ? 'rgba(12,12,18,.78)' : '#19d3c5';
    c.strokeStyle = col; c.lineWidth = Math.max(2.5, sz * .07); c.lineCap = 'round'; c.lineJoin = 'round';
    c.translate(cx, cy); c.rotate((d - 1) * Math.PI / 2);   // d=1 is right
    for (let j = 0; j < 3; j++){
      const u = ((t * .9 + j / 3) % 1), x = (u - .5) * sz * .62, a = Math.sin(u * Math.PI);
      c.globalAlpha = .25 + .75 * a;
      c.beginPath(); c.moveTo(x - sz * .1, -sz * .17); c.lineTo(x + sz * .08, 0); c.lineTo(x - sz * .1, sz * .17); c.stroke();
    }
  } else if (k === K_PORTAL){
    const col = on ? 'rgba(12,12,18,.78)' : PAIR_COLORS[pairIdx % PAIR_COLORS.length];
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(2.5, sz * .07); c.lineCap = 'round';
    c.translate(cx, cy);
    for (let j = 0; j < 2; j++){
      c.beginPath(); c.arc(0, 0, sz * (j ? .17 : .3), t * (j ? -3 : 2.2) + j * 2, t * (j ? -3 : 2.2) + j * 2 + 3.6); c.stroke();
    }
    c.beginPath(); c.arc(0, 0, sz * .045, 0, 7); c.fill();
  }
  c.restore();
}

function drawHudBack(){
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.beginPath();
  for (let x = -1; x <= lv.W + 1; x++){ ctx.moveTo(ox + x * cs + .5, oy - cs); ctx.lineTo(ox + x * cs + .5, oy + (lv.H + 1) * cs); }
  for (let y = -1; y <= lv.H + 1; y++){ ctx.moveTo(ox - cs, oy + y * cs + .5); ctx.lineTo(ox + (lv.W + 1) * cs, oy + y * cs + .5); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.beginPath();
  for (let x = -1; x <= lv.W + 1; x++) for (let y = -1; y <= lv.H + 1; y++){
    const X = ox + x * cs + .5, Y = oy + y * cs + .5;
    ctx.moveTo(X - 3, Y); ctx.lineTo(X + 3, Y); ctx.moveTo(X, Y - 3); ctx.lineTo(X, Y + 3);
  }
  ctx.stroke();
  const m = 4, L = 18;
  ctx.strokeStyle = hexA(theme.accent, .6); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(cw - m - L, m); ctx.lineTo(cw - m, m); ctx.lineTo(cw - m, m + L);
  ctx.moveTo(m, ch - m - L); ctx.lineTo(m, ch - m); ctx.lineTo(m + L, ch - m);
  ctx.moveTo(cw - m - L, ch - m); ctx.lineTo(cw - m, ch - m); ctx.lineTo(cw - m, ch - m - L);
  ctx.stroke();
}

function drawReadouts(total, done){
  ctx.font = '600 10px ' + MONO; ctx.textBaseline = 'alphabetic';
  const pct = total ? done / total * 100 : 0;
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillText('FILL', 16, ch - 30);
  ctx.fillStyle = '#fff'; ctx.font = '700 20px ' + MONO;
  ctx.fillText(pct.toFixed(3).padStart(7, '0'), 16, ch - 12);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '600 10px ' + MONO;
  ctx.fillText('TILES', cw - 16, ch - 30);
  ctx.fillStyle = '#fff'; ctx.font = '700 20px ' + MONO;
  ctx.fillText(pad2(done) + '/' + pad2(total), cw - 16, ch - 12);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '600 9px ' + MONO;
  ctx.fillText('V' + VERSION.slice(4, 8) + '.' + VERSION.slice(8, 12), cw / 2, ch - 12);
}

function drawBall(X, Y, R, sc, now){
  const sk = skinOf(); R *= sc;
  if (R < 1) return;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.beginPath(); ctx.arc(X, Y, R + 2.5, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(X - R * .35, Y - R * .4, R * .1, X, Y, R);
  if (sk.stops) sk.stops.forEach(s => g.addColorStop(s[0], s[1]));
  else { const h = (now / 12) % 360; g.addColorStop(0, '#fff'); g.addColorStop(.5, 'hsl(' + h + ',90%,62%)'); g.addColorStop(1, 'hsl(' + ((h + 80) % 360) + ',90%,32%)'); }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, R, 0, 7); ctx.fill();
  if (sk.rim){ ctx.strokeStyle = sk.rim; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X, Y, R, 0, 7); ctx.stroke(); }
}

function ballState(now){
  let bx = px + .5, by = py + .5, sc = 1;
  if (anim){
    const p = Math.min(Math.max(0, now - anim.t0) / 1000 * SPEED, anim.path.length);
    const i = Math.min(Math.floor(p), anim.path.length - 1), f = p - i;
    const a = i === 0 ? anim.from : anim.path[i - 1], b = anim.path[i];
    if (b[2]){
      if (f < .5){ bx = a[0] + .5; by = a[1] + .5; sc = 1 - f * 2; }
      else { bx = b[0] + .5; by = b[1] + .5; sc = (f - .5) * 2; }
    } else { bx = a[0] + (b[0] - a[0]) * f + .5; by = a[1] + (b[1] - a[1]) * f + .5; }
  } else if (bump){
    const k = (now - bump.t0) / 140;
    if (k >= 1) bump = null;
    else { const o = Math.sin(k * Math.PI) * .16, v = DIRS[bump.d]; bx += v[0] * o; by += v[1] * o; }
  }
  return { bx, by, sc };
}

const TILE_BASE = { [K_NORMAL]: '#14151b', [K_STICKY]: '#2a1022', [K_ONEWAY]: '#0e2224', [K_PORTAL]: '#1b1433' };

function frame(now){
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  if (lv) update(now, dt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (lv){
    drawHudBack();
    const age = (performance.now() - loadStart) / 1000;
    let total = 0, done = 0;
    for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
      const i = y * lv.W + x;
      if (!lv.floor[i]) continue;
      total++; if (painted[i]) done++;
      ctx.globalAlpha = Math.min(1, Math.max(0, (age - (x + y) * 0.03) / 0.25));
      tilePath(x, y, 1);
      ctx.fillStyle = TILE_BASE[lv.kind[i]]; ctx.fill();
      ctx.strokeStyle = lv.kind[i] ? hexA(theme.accent, .35) : '#2b2d38'; ctx.lineWidth = 1; ctx.stroke();
      if (!painted[i] && !lv.kind[i]){ ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(ox + (x + .5) * cs - 1, oy + (y + .5) * cs - 1, 2, 2); }
    }
    ctx.globalAlpha = 1;

    if (gl){
      renderGL(now);
      ctx.drawImage(glc, ox - cs, oy - cs, (lv.W + 2) * cs, (lv.H + 2) * cs);
    } else {
      for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
        const s = stroke[y * lv.W + x]; if (!s) continue;
        const c = PAL[s - 1]; ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        tilePath(x, y, 0); ctx.fill();
      }
    }

    // special tile glyphs sit on top of the paint
    const t = now / 1000, age2 = Math.min(1, Math.max(0, age - .3));
    ctx.globalAlpha = age2;
    for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
      const i = y * lv.W + x, k = lv.kind[i];
      if (lv.floor[i] && k) glyph(ctx, k, lv.dir[i], ox + x * cs, oy + y * cs, cs, t, !!painted[i], lv.pair[i]);
    }
    ctx.globalAlpha = 1;

    // hint overlay
    if (hintShown){
      const pulse = .35 + .3 * Math.sin(now / 160);
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse + ')'; ctx.lineWidth = 2.5;
      for (const e of hintShown.path){ tilePath(e[0], e[1], 3); ctx.stroke(); }
      const last = hintShown.path[hintShown.path.length - 1];
      if (last){
        const X = ox + (last[0] + .5) * cs, Y = oy + (last[1] + .5) * cs, d = hintShown.d, v = DIRS[d], s = cs * .2;
        ctx.save(); ctx.translate(X, Y); ctx.rotate((d - 1) * Math.PI / 2);
        ctx.fillStyle = '#ffd60a'; ctx.shadowColor = 'rgba(255,214,10,.9)'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(s * 1.3, 0); ctx.lineTo(-s, -s * 1.1); ctx.lineTo(-s * .4, 0); ctx.lineTo(-s, s * 1.1); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    if (trapped){
      ctx.strokeStyle = 'rgba(255,59,48,' + (.35 + .25 * Math.sin(now / 140)) + ')'; ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, cw - 4, ch - 4);
    }

    // ball + reticle
    const b = ballState(now), X = ox + b.bx * cs, Y = oy + b.by * cs, R = cs * 0.27;
    const half = cs * 0.46, tk = cs * 0.2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
      ctx.moveTo(X + sx * half, Y + sy * (half - tk)); ctx.lineTo(X + sx * half, Y + sy * half); ctx.lineTo(X + sx * (half - tk), Y + sy * half);
    }
    ctx.stroke();
    ctx.restore();
    drawBall(X, Y, R, b.sc, now);
    for (const q of particles){
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawReadouts(total, done);
  }
  requestAnimationFrame(frame);
}

/* ---------- update check ----------
   version.json is deployed next to index.html. If it reports a newer build
   than the one running, show a toast; tapping it reloads with a cache-busting URL. */
let updateShown = false;
async function checkUpdate(){
  if (updateShown || document.hidden) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && /^\d{14}$/.test(String(j.version)) && Number(j.version) > Number(VERSION)) showUpdate(String(j.version));
  } catch (e) { /* offline, file://, or blocked: ignore */ }
}
function showUpdate(v){
  updateShown = true;
  const b = $('upd');
  b.hidden = false;
  b.onclick = () => location.replace(location.pathname + '?v=' + v + location.hash);
}
setTimeout(checkUpdate, 3000);
setInterval(checkUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
window.addEventListener('online', checkUpdate);

window.__slidefill = {
  getLevel, generateLevel, slide, verify, analyze, DIRS, BAKED, hasGL: () => !!gl,
  state: () => ({ mode, n: lv && lv.n, moveCount, trapped, hint: !!hintPath, won, S, painted: Array.from(painted || []) }),
  startLevel, startDaily, openHome, S: () => S, _daily: getDaily,
};
layout();
startLevel(S.cur);
requestAnimationFrame(frame);
})();
</script>
