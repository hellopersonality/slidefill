<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slidefill</title>
<style>
  :root{
    --o:#ff9f1c; --r:#ff3b30; --b:#4aa8ff; --y:#ffd60a; --c:#3d63ff;
    --ink:#0b0b0e; --line:#2a2c34;
    --num:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;color:#fff;font-family:var(--num);overflow:hidden;overscroll-behavior:none;
    background:#050507;touch-action:none}
  #bg{position:fixed;inset:-44px;z-index:0;pointer-events:none;will-change:transform;
    background:radial-gradient(#ffffff26 1.1px,transparent 1.4px) 0 0/22px 22px;animation:drift 3.5s linear infinite}
  @keyframes drift{to{transform:translate(22px,22px)}}
  #app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:520px;margin:0 auto;touch-action:none}
  small{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  header{display:flex;gap:8px;padding:12px 0 4px}
  .tile{height:72px;border-radius:22px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;display:flex;flex-direction:column;justify-content:center}
  .tile b{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .t-level{flex:1.5;background:var(--o);color:#000;flex-direction:row;align-items:center;justify-content:space-between;padding:0 8px}
  .t-level .mid{text-align:center;display:flex;flex-direction:column;gap:3px}
  .t-moves{flex:1;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 0 0 1px #23252d;padding:0 14px;gap:3px}
  .t-par{width:72px;flex:none;border-radius:50%;background:var(--c);align-items:center;gap:3px}
  .nav{width:30px;height:30px;border-radius:50%;border:0;background:#000;color:var(--o);font-size:17px;line-height:1;padding:0}
  .nav:disabled{opacity:.28}
  #stage{flex:1;position:relative;min-height:0;touch-action:none}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  footer{display:flex;gap:8px;padding:6px 0 14px}
  footer button{flex:1;height:56px;border-radius:20px;border:3px solid #000;box-shadow:0 0 0 1px #23252d;
    font:800 15px var(--num);letter-spacing:.1em;color:#000}
  #undo{background:var(--b)} #restart{background:var(--r)}
  footer button:active,.nav:active{transform:scale(.97)}
  #hint{position:absolute;left:0;right:0;bottom:40px;text-align:center;font:600 11px var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:#9a9cab;pointer-events:none;transition:opacity .6s}
  /* victory screen */
  #victory{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,5,7,.8);opacity:0}
  #victory.show{display:flex;animation:fadein .35s forwards}
  @keyframes fadein{to{opacity:1}}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes shine{to{background-position:200% 0}}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .vwrap{position:relative;width:min(360px,calc(100% - 28px));display:flex;flex-direction:column;gap:14px;text-align:center}
  #vsec{font:600 11px var(--mono);letter-spacing:.2em;color:#9a9cab;animation:rise .4s both}
  #vtitle{margin:0;font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1;color:transparent;
    background:linear-gradient(90deg,#ff9f1c,#ff3b30,#ff2e93,#a56bff,#3d63ff,#4aa8ff,#19d3c5,#ffd60a,#ff9f1c) 0 0/200% 100%;
    -webkit-background-clip:text;background-clip:text;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,shine 2.4s linear infinite}
  .stars{display:flex;justify-content:center;gap:10px}
  .stars i{font-style:normal;font-size:48px;line-height:1;color:#23252d}
  .stars i.on{color:var(--y);text-shadow:0 0 20px rgba(255,214,10,.65);animation:pop .55s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(.35s + var(--k)*.2s)}
  .vstats{display:flex;gap:8px;justify-content:center}
  .vstats .tile{animation:rise .5s both}
  .vstats .tile:nth-child(1){animation-delay:.15s} .vstats .tile:nth-child(2){animation-delay:.25s} .vstats .tile:nth-child(3){animation-delay:.35s}
  .t-eff{flex:1;background:var(--o);color:#000;padding:0 14px;gap:3px}
  #vnext{height:62px;border-radius:22px;border:3px solid #000;background:var(--y);color:#000;font:800 18px var(--num);letter-spacing:.1em;
    box-shadow:0 0 0 1px #23252d;animation:rise .5s .9s both}
  #vreplay{height:46px;border-radius:18px;border:2px solid var(--line);background:transparent;color:#c9cad6;font:700 13px var(--mono);letter-spacing:.16em;animation:rise .5s 1s both}
  #vnext:active,#vreplay:active{transform:scale(.97)}
  /* update toast */
  #upd{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top) + 96px);width:min(360px,calc(100% - 28px));
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-radius:20px;text-align:left;
    border:3px solid #000;background:var(--y);color:#000;box-shadow:0 0 0 1px #23252d,0 12px 32px rgba(0,0,0,.55);
    animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
  #upd[hidden]{display:none}
  #upd small{display:block;margin-bottom:2px}
  #upd b{font:800 17px var(--num);letter-spacing:.08em}
  #upd i{font-style:normal;font-size:28px;line-height:1}
  #upd:active{transform:translateX(-50%) scale(.98)}
  @keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="tile t-level">
      <button class="nav" id="prev" aria-label="Previous level">&#8249;</button>
      <div class="mid"><small>Level</small><b id="lvl">01</b></div>
      <button class="nav" id="next" aria-label="Next level">&#8250;</button>
    </div>
    <div class="tile t-moves"><small>Moves</small><b id="mv">0</b></div>
    <div class="tile t-par"><small>Par</small><b id="par" style="font-size:28px">0</b></div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint">Swipe to slide / paint every tile</div>
  </div>
  <footer>
    <button id="undo">UNDO</button>
    <button id="restart">RESTART</button>
  </footer>
</div>
<button id="upd" hidden><span><small>Update ready</small><b>TAP TO RELOAD</b></span><i>&#8635;</i></button>
<div id="victory" role="dialog" aria-live="polite">
  <canvas id="fx"></canvas>
  <div class="vwrap">
    <div id="vsec"></div>
    <h2 id="vtitle">CLEARED</h2>
    <div class="stars" id="vstars"></div>
    <div class="vstats">
      <div class="tile t-moves"><small>Moves</small><b id="vmv">0</b></div>
      <div class="tile t-par"><small>Par</small><b id="vpar" style="font-size:28px">0</b></div>
      <div class="tile t-eff"><small>Eff</small><b id="veff">0</b></div>
    </div>
    <button id="vnext">NEXT LEVEL</button>
    <button id="vreplay">REPLAY</button>
  </div>
</div>
<script>
(() => {
'use strict';

// Stamped by `node bump-version.js` (which also writes version.json). Do not edit by hand.
const VERSION = '20261027011908';

/* ---------- level generation ----------
   Levels are built by walking a legal solution into existence:
   start on a cell, repeatedly pick a slide, mark the cell just past the
   stopping point as a wall, and record the move. Floor = every cell the walk
   covered; everything else is wall. The recorded move list is therefore a
   valid full-coverage solution by construction.                              */
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // up, right, down, left

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function params(n){
  const W = Math.min(9, 4 + Math.floor((n - 1) / 3));
  const H = Math.min(13, W + 4);
  const moves = Math.min(18, 4 + Math.ceil(n * 0.6));
  return { W, H, moves };
}

function attempt(rng, W, H, M){
  const idx = (x, y) => y * W + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const wall = new Uint8Array(W * H), vis = new Uint8Array(W * H);
  let x = Math.floor(rng() * W), y = Math.floor(rng() * H);
  const start = { x, y };
  vis[idx(x, y)] = 1;
  let count = 1;
  const moves = [];
  for (let s = 0; s < M; s++){
    const opts = [];
    for (let d = 0; d < 4; d++){
      const [dx, dy] = DIRS[d];
      let cx = x, cy = y, k = 0, nw = 0;
      for (;;){
        cx += dx; cy += dy;
        if (!inb(cx, cy) || wall[idx(cx, cy)]) break;
        k++;
        if (!vis[idx(cx, cy)]) nw++;
        const bx = cx + dx, by = cy + dy;
        const ok = !inb(bx, by) || wall[idx(bx, by)] || !vis[idx(bx, by)];
        if (ok && nw > 0) opts.push({ d, L: k, nw });
      }
    }
    if (!opts.length) break;
    let total = 0;
    for (const o of opts) total += o.nw + 0.5;
    let r = rng() * total, pick = opts[opts.length - 1];
    for (const o of opts){ r -= o.nw + 0.5; if (r <= 0){ pick = o; break; } }
    const [dx, dy] = DIRS[pick.d];
    for (let i = 0; i < pick.L; i++){
      x += dx; y += dy;
      if (!vis[idx(x, y)]){ vis[idx(x, y)] = 1; count++; }
    }
    const bx = x + dx, by = y + dy;
    if (inb(bx, by)) wall[idx(bx, by)] = 1;
    moves.push(pick.d);
  }
  return { W, H, start, floor: vis, moves, count };
}

function generate(n){
  const { W, H, moves: M } = params(n);
  const rng = mulberry32(n * 7919 + 101);
  const minMoves = Math.max(3, M - 2);
  let best = null, fallback = null;
  for (let i = 0; i < 400; i++){
    const a = attempt(rng, W, H, M);
    if (!fallback || a.count > fallback.count) fallback = a;
    if (a.moves.length < minMoves) continue;
    if (!best || a.count > best.count) best = a;
    if (best.count >= 0.55 * W * H) break;
  }
  const lv = best || fallback;
  lv.n = n;
  return lv;
}

// Slide from (x,y) in direction d on a floor grid; returns visited cells (excluding origin)
function slide(lv, x, y, d){
  const { W, H, floor } = lv, [dx, dy] = DIRS[d], path = [];
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H || !floor[ny * W + nx]) break;
    x = nx; y = ny; path.push([x, y]);
  }
  return path;
}

/* ---------- palette ---------- */
const PAL_HEX = ['#ff9f1c', '#ff3b30', '#4aa8ff', '#ffd60a', '#3d63ff', '#19d3c5', '#ff2e93', '#a56bff'];
const PAL = PAL_HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let lv, painted, stroke, flash, px, py, moveCount, history, anim = null, particles = [], won = false;
let winStart = 0, loadStart = 0, winEff = 0;
let cs = 40, ox = 0, oy = 0, dpr = 1, cw = 0, ch = 0;
const pad2 = n => String(n).padStart(2, '0');

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }
let maxLevel = parseInt(store('slidefill.max'), 10) || 1;
let curLevel = Math.min(parseInt(store('slidefill.cur'), 10) || 1, maxLevel);

/* ---------- WebGL paint shader ----------
   Renders only the painted cells (plus a one-cell margin for glow) into an
   offscreen canvas which is then composited onto the 2D canvas.             */
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uSize; uniform vec2 uGrid; uniform float uCell; uniform float uTime; uniform float uWin;
uniform sampler2D uMask; uniform sampler2D uFlash;
vec4 mk(vec2 c){ if(c.x<0.||c.y<0.||c.x>=uGrid.x||c.y>=uGrid.y) return vec4(0.); return texture2D(uMask,(c+.5)/uGrid); }
float fl(vec2 c){ if(c.x<0.||c.y<0.||c.x>=uGrid.x||c.y>=uGrid.y) return 0.; return texture2D(uFlash,(c+.5)/uGrid).r; }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y);
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y);
  vec2 g = px / uCell - 1.0;
  vec2 c = floor(g), f = g - c;
  vec4 m = mk(c);
  vec4 res = vec4(0.);
  if (m.a > .5) {
    vec3 col = m.rgb;
    float pu=mk(c+vec2(0.,-1.)).a, pr=mk(c+vec2(1.,0.)).a, pd=mk(c+vec2(0.,1.)).a, pl=mk(c+vec2(-1.,0.)).a;
    float ext = 9.;
    if (pl<.5) ext=min(ext,f.x);
    if (pr<.5) ext=min(ext,1.-f.x);
    if (pu<.5) ext=min(ext,f.y);
    if (pd<.5) ext=min(ext,1.-f.y);
    float cover = 1., dd = 9.;
    bool right = f.x>=.5, bot = f.y>=.5;
    float nx = right ? pr : pl;
    float ny = bot ? pd : pu;
    float r = .26;
    if (nx<.5 && ny<.5) {
      vec2 cc = vec2(right?1.-r:r, bot?1.-r:r);
      bool inCorner = (right ? f.x>cc.x : f.x<cc.x) && (bot ? f.y>cc.y : f.y<cc.y);
      if (inCorner) {
        dd = length(f-cc)-r;
        float aa = 1.2/uCell;
        cover = 1.-smoothstep(-aa,aa,dd);
        ext = min(ext,-dd);
      }
    }
    float t = uTime;
    vec2 w = px/uCell;
    float n = noise(w*1.8+vec2(t*.30,-t*.22))*.6 + noise(w*4.5+vec2(-t*.45,t*.35))*.4;
    float band = .5+.5*sin((w.x*.9+w.y*1.3)*2.2 - t*1.6);
    vec3 base = col*(.74+.42*n) + col*.22*band*band;
    base += vec3(.10)*smoothstep(.55,1.,n);
    float rim = smoothstep(.10,0.,ext);
    base = mix(base, col*1.25+.12, rim*.8);
    base *= mix(.80,1.,smoothstep(0.,.35,ext));
    base += vec3(1.)*fl(c)*.55;
    if (uWin >= 0.) {
      float diag = g.x+g.y;
      float wave = exp(-pow((diag-uWin*(uGrid.x+uGrid.y)*1.4)*.6,2.));
      base += vec3(.9)*wave;
      base *= 1.+.10*sin(uWin*5.);
    }
    res = vec4(min(base,vec3(1.))*cover, cover);
    if (cover < 1.) {
      float k = exp(-max(dd,0.)*5.5)*.5;
      res += vec4(col*k,k)*(1.-cover);
    }
  } else {
    vec3 acc = vec3(0.); float ga = 0.;
    for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++) {
      if (i==0 && j==0) continue;
      vec2 o = vec2(float(i),float(j));
      vec4 nm = mk(c+o);
      if (nm.a > .5) {
        vec2 q = max(abs(f-(.5+o))-.5, 0.);
        float k = exp(-length(q)*5.5);
        acc += nm.rgb*k; ga += k;
      }
    }
    if (ga > 0.) { float a = clamp(ga*.5,0.,.55); res = vec4(acc/ga*a, a); }
  }
  gl_FragColor = res;
}`;

const glc = document.createElement('canvas');
let gl = null, glProg = null, glU = {}, texMask = null, texFlash = null, maskBuf = null, flashBuf = null;
(function initGL(){
  try {
    gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
    if (!gl) return;
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));
    gl.useProgram(glProg);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProg, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['uSize','uGrid','uCell','uTime','uWin','uMask','uFlash']) glU[n] = gl.getUniformLocation(glProg, n);
    const mkTex = () => {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    texMask = mkTex(); texFlash = mkTex();
    gl.uniform1i(glU.uMask, 0); gl.uniform1i(glU.uFlash, 1);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  } catch (e) { console.error('WebGL disabled:', e); gl = null; }
})();

function renderGL(now){
  const W = lv.W, H = lv.H, N = W * H;
  for (let i = 0; i < N; i++){
    const s = stroke[i], o = i * 4;
    if (s){ const c = PAL[s - 1]; maskBuf[o] = c[0]; maskBuf[o + 1] = c[1]; maskBuf[o + 2] = c[2]; maskBuf[o + 3] = 255; }
    else { maskBuf[o] = maskBuf[o + 1] = maskBuf[o + 2] = maskBuf[o + 3] = 0; }
    flashBuf[o] = Math.round(flash[i] * 255);
  }
  gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texMask);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, maskBuf);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texFlash);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, flashBuf);
  gl.uniform2f(glU.uSize, glc.width, glc.height);
  gl.uniform2f(glU.uGrid, W, H);
  gl.uniform1f(glU.uCell, cs * dpr);
  gl.uniform1f(glU.uTime, now / 1000);
  gl.uniform1f(glU.uWin, won ? Math.max(0, (now - winStart) / 1000) : -1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- level load / layout ---------- */
function load(n){
  curLevel = n; store('slidefill.cur', String(n));
  lv = generate(n);
  const N = lv.W * lv.H;
  painted = new Uint8Array(N); stroke = new Uint8Array(N); flash = new Float32Array(N);
  maskBuf = new Uint8Array(N * 4); flashBuf = new Uint8Array(N * 4);
  px = lv.start.x; py = lv.start.y;
  painted[py * lv.W + px] = 1;
  stroke[py * lv.W + px] = (n % PAL.length) + 1;
  flash[py * lv.W + px] = 1;
  moveCount = 0; history = []; anim = null; particles = []; won = false;
  loadStart = performance.now();
  hideVictory(); winEff = 0;
  $('lvl').textContent = pad2(n);
  $('par').textContent = lv.moves.length;
  $('mv').textContent = 0;
  $('prev').disabled = n <= 1;
  $('next').disabled = n >= maxLevel;
  $('hint').style.opacity = n === 1 ? 1 : 0;
  layout();
}

function layout(){
  const st = $('stage');
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = st.clientWidth; ch = st.clientHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  if (!lv) return;
  const padX = 12, padY = 40;
  cs = Math.floor(Math.min((cw - padX * 2) / lv.W, (ch - padY * 2) / lv.H, 72));
  ox = Math.round((cw - cs * lv.W) / 2);
  oy = Math.round((ch - cs * lv.H) / 2);
  glc.width = Math.round((lv.W + 2) * cs * dpr);
  glc.height = Math.round((lv.H + 2) * cs * dpr);
}

/* ---------- input ---------- */
function tryMove(d){
  if (anim || won) return;
  const path = slide(lv, px, py, d);
  if (!path.length) return;
  history.push({ x: px, y: py, painted: painted.slice(), stroke: stroke.slice(), moves: moveCount });
  anim = { path, from: [px, py], t0: performance.now(), done: 0, ci: (moveCount + lv.n) % PAL.length };
  $('hint').style.opacity = 0;
}

function undo(){
  if (anim || !history.length) return;
  const h = history.pop();
  px = h.x; py = h.y; painted = h.painted; stroke = h.stroke; moveCount = h.moves;
  flash.fill(0);
  won = false; hideVictory();
  $('mv').textContent = moveCount;
}

// Swipe anywhere on the screen (gestures that start on a button are left to the button)
let drag = null;
const stage = $('stage');
window.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button')) { drag = null; return; }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, fired: false };
});
window.addEventListener('pointermove', e => {
  if (!drag || drag.fired || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  drag.fired = true;
  tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});
const end = e => { if (!drag || e.pointerId === drag.id) drag = null; };
window.addEventListener('pointerup', end);
window.addEventListener('pointercancel', end);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
  if (k in map){ e.preventDefault(); tryMove(map[k]); }
  else if (k === 'z' || k === 'u') undo();
  else if (k === 'r') load(curLevel);
  else if ((k === 'enter' || k === ' ') && $('victory').classList.contains('show')) load(curLevel + 1);
});
$('undo').onclick = undo;
$('restart').onclick = () => load(curLevel);
$('prev').onclick = () => { if (curLevel > 1) load(curLevel - 1); };
$('next').onclick = () => { if (curLevel < maxLevel) load(curLevel + 1); };
$('vnext').onclick = () => load(curLevel + 1);
$('vreplay').onclick = () => load(curLevel);
new ResizeObserver(layout).observe(stage);

/* ---------- update ---------- */
const SPEED = 20; // cells per second
function burst(x, y, rgb){
  const col = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 1.5 + Math.random() * 2.5, col });
  }
}

function update(now, dt){
  for (let i = 0; i < flash.length; i++) if (flash[i] > 0) flash[i] = Math.max(0, flash[i] - dt * 2.2);
  if (anim){
    const p = Math.max(0, now - anim.t0) / 1000 * SPEED;
    const total = anim.path.length;
    while (anim.done < total && p >= anim.done + 1){
      const [cx, cy] = anim.path[anim.done], i = cy * lv.W + cx;
      painted[i] = 1; stroke[i] = anim.ci + 1; flash[i] = 1; anim.done++;
    }
    if (anim.done >= total){
      const [lx, ly] = anim.path[total - 1];
      px = lx; py = ly; moveCount++;
      $('mv').textContent = moveCount;
      burst(ox + (px + .5) * cs, oy + (py + .5) * cs, PAL[anim.ci]);
      anim = null;
      let all = true;
      for (let i = 0; i < painted.length; i++) if (lv.floor[i] && !painted[i]){ all = false; break; }
      if (all) win();
    }
  }
  for (const q of particles){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .93; q.vy *= .93; q.life -= dt * 2.2; }
  particles = particles.filter(q => q.life > 0);
}

function win(){
  won = true; winStart = performance.now();
  if (curLevel >= maxLevel){ maxLevel = curLevel + 1; store('slidefill.max', String(maxLevel)); }
  $('next').disabled = false;
  winEff = Math.min(100, Math.round(lv.moves.length / moveCount * 100));
  const token = winStart;
  setTimeout(() => { if (won && winStart === token) showVictory(); }, 1100); // let the board sweep play first
}

/* ---------- victory screen ---------- */
const fx = $('fx'), fctx = fx.getContext('2d');
let conf = [], fxRaf = 0, fxEnd = 0, fxLast = 0;

function showVictory(){
  const par = lv.moves.length, diff = moveCount - par;
  const stars = diff <= 0 ? 3 : diff <= 2 ? 2 : 1;
  $('vsec').textContent = 'SECTOR ' + pad2(lv.n);
  $('vtitle').textContent = ['', 'CLEARED', 'GREAT', 'PERFECT'][stars];
  $('vstars').innerHTML = [0, 1, 2].map(k => '<i class="' + (k < stars ? 'on' : '') + '" style="--k:' + k + '">★</i>').join('');
  $('vmv').textContent = moveCount; $('vpar').textContent = par; $('veff').textContent = winEff + '%';
  $('victory').classList.add('show');
  startConfetti(stars);
}

function hideVictory(){
  $('victory').classList.remove('show');
  cancelAnimationFrame(fxRaf); conf = [];
  fctx.clearRect(0, 0, fx.width, fx.height);
}

function piece(x, y, vx, vy){
  const c = PAL[Math.floor(Math.random() * PAL.length)];
  return { x, y, vx, vy, r: Math.random() * 6.28, vr: (Math.random() - .5) * 12, w: 6 + Math.random() * 7, h: 5 + Math.random() * 6, col: 'rgb(' + c + ')' };
}

function startConfetti(stars){
  const d = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  fx.width = Math.round(W * d); fx.height = Math.round(H * d);
  fctx.setTransform(d, 0, 0, d, 0, 0);
  conf = [];
  for (let i = 0; i < 60 + stars * 30; i++){
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.3, s = 350 + Math.random() * 650;
    conf.push(piece(W / 2, H * .4, Math.cos(a) * s, Math.sin(a) * s));
  }
  fxEnd = performance.now() + 1500 + stars * 800; fxLast = performance.now();
  cancelAnimationFrame(fxRaf); fxRaf = requestAnimationFrame(fxFrame);
}

function fxFrame(now){
  const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
  const W = innerWidth, H = innerHeight;
  if (now < fxEnd && Math.random() < .55) conf.push(piece(Math.random() * W, -12, (Math.random() - .5) * 60, 80 + Math.random() * 120));
  fctx.clearRect(0, 0, W, H);
  const damp = Math.pow(.2, dt);
  for (const p of conf){
    p.vx *= damp; p.vy = p.vy * damp + 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.fillStyle = p.col;
    fctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r * 1.7)), p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
    fctx.restore();
  }
  conf = conf.filter(p => p.y < H + 20);
  if (conf.length || now < fxEnd) fxRaf = requestAnimationFrame(fxFrame);
}

/* ---------- draw ---------- */
function cell(x, y){ return x >= 0 && y >= 0 && x < lv.W && y < lv.H && lv.floor[y * lv.W + x] === 1; }

function tilePath(x, y, inset){
  const r = cs * 0.26;
  const u = !cell(x, y - 1), rt = !cell(x + 1, y), d = !cell(x, y + 1), l = !cell(x - 1, y);
  const radii = [u && l ? r : 0, u && rt ? r : 0, d && rt ? r : 0, d && l ? r : 0];
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(ox + x * cs + inset, oy + y * cs + inset, cs - inset * 2, cs - inset * 2, radii);
  else ctx.rect(ox + x * cs + inset, oy + y * cs + inset, cs - inset * 2, cs - inset * 2);
}

function drawHudBack(){
  // faint grid + plus marks (extends one cell beyond the board)
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.beginPath();
  for (let x = -1; x <= lv.W + 1; x++){ ctx.moveTo(ox + x * cs + .5, oy - cs); ctx.lineTo(ox + x * cs + .5, oy + (lv.H + 1) * cs); }
  for (let y = -1; y <= lv.H + 1; y++){ ctx.moveTo(ox - cs, oy + y * cs + .5); ctx.lineTo(ox + (lv.W + 1) * cs, oy + y * cs + .5); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.beginPath();
  for (let x = -1; x <= lv.W + 1; x++) for (let y = -1; y <= lv.H + 1; y++){
    const X = ox + x * cs + .5, Y = oy + y * cs + .5;
    ctx.moveTo(X - 3, Y); ctx.lineTo(X + 3, Y); ctx.moveTo(X, Y - 3); ctx.lineTo(X, Y + 3);
  }
  ctx.stroke();
  // corner brackets
  const m = 4, L = 18;
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(cw - m - L, m); ctx.lineTo(cw - m, m); ctx.lineTo(cw - m, m + L);
  ctx.moveTo(m, ch - m - L); ctx.lineTo(m, ch - m); ctx.lineTo(m + L, ch - m);
  ctx.moveTo(cw - m - L, ch - m); ctx.lineTo(cw - m, ch - m); ctx.lineTo(cw - m, ch - m - L);
  ctx.stroke();
}

function drawReadouts(total, done){
  ctx.font = '600 10px ' + MONO; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.textAlign = 'left';  ctx.fillText('GRID ' + pad2(lv.W) + 'x' + pad2(lv.H), 16, 22);
  ctx.textAlign = 'right'; ctx.fillText('SEC ' + pad2(lv.n), cw - 16, 22);
  if (won){
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd60a'; ctx.font = '700 11px ' + MONO;
    ctx.fillText('SECTOR CLEARED / EFF ' + winEff + '%', cw / 2, 22);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '600 10px ' + MONO;
  }
  const pct = total ? done / total * 100 : 0;
  ctx.textAlign = 'left';  ctx.fillText('FILL', 16, ch - 30);
  ctx.fillStyle = '#fff'; ctx.font = '700 20px ' + MONO;
  ctx.fillText(pct.toFixed(3).padStart(7, '0'), 16, ch - 12);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '600 10px ' + MONO;
  ctx.fillText('TILES', cw - 16, ch - 30);
  ctx.fillStyle = '#fff'; ctx.font = '700 20px ' + MONO;
  ctx.fillText(pad2(done) + '/' + pad2(total), cw - 16, ch - 12);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '600 9px ' + MONO;
  ctx.fillText('V' + VERSION.slice(4, 8) + '.' + VERSION.slice(8, 12), cw / 2, ch - 12);
}

function frame(now){
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  if (lv) update(now, dt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (lv){
    drawHudBack();
    const age = (performance.now() - loadStart) / 1000;
    let total = 0, done = 0;
    for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
      const i = y * lv.W + x;
      if (!lv.floor[i]) continue;
      total++; if (painted[i]) done++;
      const a = Math.min(1, Math.max(0, (age - (x + y) * 0.03) / 0.25));
      ctx.globalAlpha = a;
      tilePath(x, y, 1);
      ctx.fillStyle = '#14151b'; ctx.fill();
      ctx.strokeStyle = '#2b2d38'; ctx.lineWidth = 1; ctx.stroke();
      if (!painted[i]){ ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(ox + (x + .5) * cs - 1, oy + (y + .5) * cs - 1, 2, 2); }
    }
    ctx.globalAlpha = 1;

    if (gl){
      renderGL(now);
      ctx.drawImage(glc, ox - cs, oy - cs, (lv.W + 2) * cs, (lv.H + 2) * cs);
    } else {
      for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
        const s = stroke[y * lv.W + x]; if (!s) continue;
        const c = PAL[s - 1]; ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        tilePath(x, y, 0); ctx.fill();
      }
    }

    // ball + reticle
    let bx = px + .5, by = py + .5;
    if (anim){
      const p = Math.min(Math.max(0, now - anim.t0) / 1000 * SPEED, anim.path.length);
      const i = Math.min(Math.floor(p), anim.path.length - 1);
      const f = p - i;
      const a = i === 0 ? anim.from : anim.path[i - 1], b = anim.path[i];
      bx = a[0] + (b[0] - a[0]) * f + .5; by = a[1] + (b[1] - a[1]) * f + .5;
    }
    const X = ox + bx * cs, Y = oy + by * cs, R = cs * 0.27;
    const half = cs * 0.46, tk = cs * 0.2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const [sx, sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      ctx.moveTo(X + sx * half, Y + sy * (half - tk)); ctx.lineTo(X + sx * half, Y + sy * half); ctx.lineTo(X + sx * (half - tk), Y + sy * half);
    }
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.arc(X, Y, R + 2.5, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(X - R * .35, Y - R * .4, R * .1, X, Y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#e4e6f2'); g.addColorStop(1, '#9ea2bd');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, R, 0, 7); ctx.fill();
    for (const q of particles){
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawReadouts(total, done);
  }
  requestAnimationFrame(frame);
}

/* ---------- update check ----------
   version.json is deployed next to index.html. If it reports a newer build
   than the one running, show a toast; tapping it reloads with a cache-busting URL. */
let updateShown = false;
async function checkUpdate(){
  if (updateShown || document.hidden) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && /^\d{14}$/.test(String(j.version)) && Number(j.version) > Number(VERSION)) showUpdate(String(j.version));
  } catch (e) { /* offline, file://, or blocked: ignore */ }
}
function showUpdate(v){
  updateShown = true;
  const b = $('upd');
  b.hidden = false;
  b.onclick = () => location.replace(location.pathname + '?v=' + v + location.hash);
}
setTimeout(checkUpdate, 3000);
setInterval(checkUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
window.addEventListener('online', checkUpdate);

window.__slidefill = { generate, slide, DIRS, params, hasGL: () => !!gl };
layout();
load(curLevel);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
